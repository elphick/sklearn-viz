[project]
name = "sklearn-viz"
version = "0.6.13"
description = "Interactive visualisation for scikit-learn models"
readme = "README.md"
authors = [
    { name = "Greg", email = "11791585+elphick@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.14"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "scikit-learn>=1.2",
    "pandas>=1.3.0",
    "matplotlib>=3.3",
    "plotly>=6.1.1,<7",
    "statsmodels>=0.14.0,<0.15.0"
]

[project.scripts]
bump-version = "scripts.bump_version:main"

[project.optional-dependencies]
dev = [
    "towncrier>=23.11.0,<24.0.0",
    "tox>=4.24.1,<5.0.0",
    "pytest>=8.2.1,<9",
    "sphinx>=8,<9",
    "sphinx-gallery>=0.14.0,<1",
#    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=4.0.1,<5",
    "sphinx-autodoc-typehints>=2.1.1,<3",
    "matplotlib>=3.7.2,<4",
    "coverage>=7.8.0,<8",
    "kaleido>=1.1.0,<2",
    "sphinx-book-theme>=1.2.0,<2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# Optional, but useful if you want explicit default index config
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.towncrier]
package = "elphick.sklearn_viz"
package_dir = "."
#package = "elphick.sklearn_viz"
#package_dir = "elphick/sklearn_viz"
filename = "CHANGELOG.rst"
directory = "towncrier/newsfragments"

[tool.towncrier.fragment.feature]
[tool.towncrier.fragment.bugfix]
[tool.towncrier.fragment.doc]
[tool.towncrier.fragment.removal]
[tool.towncrier.fragment.misc]

[tool.towncrier.fragment.maint]
name = "Other Tasks"
showcontent = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elphick/sklearn_viz"]
